[project]
name = "testing-dashboard"
version = "0.1.0"
description = "Testing Dashboard: runs HR Assist test cases against the chatbot and grades them, admins only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "httpx>=0.28",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdash"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["src"]
# starlette.testclient nags about httpx2; the warning is about the test client only
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
src = ["src", "test"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "C4", "SIM", "BLE"]
ignore = ["E501", "RUF001"]
